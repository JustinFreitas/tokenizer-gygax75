name: Tokenizer Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  release:
    needs: test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Build module.json
        run: node ./.github/workflows/build-module-json.js | jq . > module.json
      - run: npm ci
      - name: Webpack
        run: npm run build
      - name: Create Release Archives
        run: |
          zip -r ./vtta-tokenizer.zip module.json dist templates css img lang vendor LICENSE.md
          cp ./vtta-tokenizer.zip ./module.zip
      - name: Upload Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" ./module.json ./vtta-tokenizer.zip ./module.zip --clobber
